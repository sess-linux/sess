[book]
title = "sess"
description = "Save and reopen terminal sessions, standalone."
authors = ["sess contributors"]
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/sess-linux/sess"
edit-url-template = "https://github.com/sess-linux/sess/edit/main/docs/{path}"

[output.html.fold]
enable = true
level = 1
