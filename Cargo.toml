[package]
name = "sess"
version = "0.2.2"
edition = "2021"
description = "Save and reopen terminal sessions (layout, commands, cwd) without relying on tmux plugins"

[[bin]]
name = "sess"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.5.4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
ratatui = "=0.26.3"
crossterm = "=0.27.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
